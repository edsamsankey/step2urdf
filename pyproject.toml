[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "step2urdf"
version = "0.1.0"
description = "Convert STEP CAD assemblies into URDF robot packages"
requires-python = ">=3.9,<3.14"
dependencies = ["cadquery-ocp-novtk>=7.7", "numpy", "pyyaml"]

[project.optional-dependencies]
app = ["streamlit>=1.30", "pandas"]
test = ["yourdfpy", "trimesh", "pytest"]

[project.scripts]
step2urdf = "step2urdf.cli:main"

[tool.setuptools]
packages = ["step2urdf"]
