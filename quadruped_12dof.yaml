  - servo_horn_2
  - link_rod_v2_2
  - p_6mm_Bearing_SKF_626_RS_286_7833_step_6
- name: leg4_lower
  parts:
  - leg_lower_2
joints:
- name: leg1_abduction
  type: revolute
  parent: base_link
  child: leg1_hip
  origin: auto
  axis: auto
  lower: -0.7
  upper: 0.7
  effort: 1.0
  velocity: 5.2
- name: leg1_thigh
  type: revolute
  parent: leg1_hip
  child: leg1_upper
  origin: auto
  axis: auto
  lower: -1.6
  upper: 1.6
  effort: 1.0
  velocity: 5.2
- name: leg1_knee
  type: revolute
  parent: leg1_upper
  child: leg1_lower
  origin: auto
  axis: auto
  lower: -0.2
  upper: 2.4
